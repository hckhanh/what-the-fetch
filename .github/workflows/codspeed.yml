name: CodSpeed

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: simulation
  workflow_dispatch:
    inputs:
      mode:
        description: CodSpeed instrument
        type: choice
        options:
          - simulation
          - walltime
          - simulation,walltime
        default: simulation
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup toolchains
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Setup Aikido Safe Chain
        env:
          SAFE_CHAIN_RELEASE: '1.5.25'
        run: |
          curl --proto '=https' --proto-redir '=https' -fsSL \
            "https://github.com/AikidoSec/safe-chain/releases/download/${SAFE_CHAIN_RELEASE}/install-safe-chain.sh" \
            -o "$RUNNER_TEMP/install-safe-chain.sh"
          echo "83069f6db4215cccf6a26bdd6e65a5c2366b9d24322b2d5d2862d47385e56682  $RUNNER_TEMP/install-safe-chain.sh" | sha256sum --check
          sh "$RUNNER_TEMP/install-safe-chain.sh" --ci
      - name: Install dependencies
        run: bun ci
      - name: Run benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          runner-version: '5.5.0'
          cycle-estimation: 'true'
          exclude-allocations: 'false'
          run: bun run bench
          mode: ${{ inputs.mode || 'simulation' }}
